name: release

# DSNA-76: a `v*` tag builds the Windows installers and the CLI for Windows, Linux and
# macOS, computes SHA-256 checksums and creates a DRAFT GitHub release. A human reviews and
# publishes it. `workflow_dispatch` is a dry run: same builds, artifacts only, no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installers + CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      # beforeBuildCommand builds the frontend and the dsnap sidecar.
      - name: Build installers (NSIS + MSI)
        run: npx tauri build --bundles nsis,msi
        working-directory: app
      - name: Collect artifacts
        shell: pwsh
        run: |
          # build.rs writes an empty sidecar placeholder; make sure the real CLI was bundled.
          Get-ChildItem app/src-tauri/binaries/dsnap-*.exe | ForEach-Object {
            if ($_.Length -eq 0) { throw "empty sidecar: $($_.Name)" }
          }
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-release/
          Copy-Item target/release/bundle/msi/*.msi dist-release/
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'dsnap-cli' | Select-Object -ExpandProperty version
          Compress-Archive -Path target/release/dsnap.exe -DestinationPath "dist-release/dsnap-$v-x86_64-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux
          - os: macos-latest
            name: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p dsnap-cli --release --locked
      - name: Package
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='dsnap-cli'))")
          mkdir -p dist-release
          tar -C target/release -czf "dist-release/dsnap-$v-${{ matrix.name }}.tar.gz" dsnap
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist-release/*

  release:
    name: Draft release
    needs: [windows, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-with-checksums
          path: artifacts/*
      - name: Create draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" --draft --generate-notes \
            --title "D-Snap ${GITHUB_REF_NAME#v}"
