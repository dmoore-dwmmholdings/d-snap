name: ci

on:
  push:
    branches: [main, "chain/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries (dsnap-app)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Diff performance (release, DSNA-40)
        run: cargo test -p dsnap-core --release --locked --test diff_perf -- --ignored --nocapture
      - name: Snapshot performance (release, DSNA-52)
        run: cargo test -p dsnap-core --release --locked --test snapshot_perf -- --ignored --nocapture --test-threads=1
      - name: Index DB insert performance (release, DSNA-101)
        run: cargo test -p dsnap-core --release --locked --lib db::tests::perf_ -- --ignored --nocapture
      - name: Store write performance (release, DSNA-102)
        run: cargo test -p dsnap-core --release --locked --test store_perf -- --ignored --nocapture
      - name: M1 acceptance (release, DSNA-65)
        run: cargo test -p dsnap-cli --release --locked --test m1_acceptance -- --ignored --nocapture
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: dependency audit (DSNA-77)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licenses, advisories, sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
      - name: No network crates in core, CLI or bridge
        run: |
          for c in dsnap-core dsnap-cli dsnap-bridge; do
            if cargo tree -p "$c" -e normal,build --locked --target all \
              | grep -E ' (reqwest|hyper|ureq|isahc|surf|curl|attohttpc|tokio-tungstenite|tungstenite) v'; then
              echo "::error::$c depends on a network crate"; exit 1
            fi
          done
