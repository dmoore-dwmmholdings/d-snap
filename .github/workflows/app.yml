name: app

on:
  push:
    branches: [main, 'chain/**']
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: npm audit (runtime dependencies, fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: No remote URLs in the built bundle (doc links in error strings are allowed)
        run: |
          npm run build
          if grep -RhoE "https?://[^\"' )]+" dist | grep -vE "^https?://(localhost|127\.0\.0\.1|ipc\.localhost|www\.w3\.org|svelte\.dev/e/|github\.com/highlightjs/)"; then
            echo "::error::remote URL in the frontend bundle"; exit 1
          fi
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  tauri:
    name: cargo build dsnap-app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds frontendDist, so the frontend must be built first.
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo build -p dsnap-app --locked
