[workspace]
resolver = "3"
members = [
    "crates/dsnap-core",
    "crates/dsnap-cli",
    "crates/dsnap-bridge",
    "crates/dsnap-test-support",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dmoore-dwmmholdings/d-snap"
publish = false

[workspace.dependencies]
# Internal crates
dsnap-core = { path = "crates/dsnap-core" }
dsnap-bridge = { path = "crates/dsnap-bridge" }
dsnap-test-support = { path = "crates/dsnap-test-support" }

# Third-party
anyhow = "1.0.100"
blake3 = "1.8.2"
clap = { version = "4.5.50", features = ["derive"] }
# 0.7: 0.8 needs Rust 1.86, above the workspace rust-version.
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
filetime = "0.2.26"
ignore = "0.4.24"
notify = "8.2.0"
proptest = "1.9.0"
rayon = "1.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = "2.7.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
zstd = "0.13.3"

# Desktop app (dsnap-app)
tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Non-test code must not panic. clippy.toml allows these inside #[cfg(test)] and #[test].
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
# Hashing and compression are slow unoptimised; this keeps debug test runs fast.
opt-level = 2
